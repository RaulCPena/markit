name: MarkIt
options:
  bundleIdPrefix: com.raulpena
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D9M7YX54A8
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MarkItCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MarkItCore
    settings:
      base:
        PRODUCT_NAME: MarkItCore
        PRODUCT_MODULE_NAME: MarkItCore
        SKIP_INSTALL: YES
        ENABLE_TESTABILITY: YES

  MarkIt:
    type: application
    platform: macOS
    sources:
      - path: Sources/MarkIt
      - path: AppResources/AppIcon.icns
        buildPhase: resources
      - path: AppResources/MenuBarIcon.png
        buildPhase: resources
      - path: "AppResources/MenuBarIcon@2x.png"
        buildPhase: resources
      - path: AppResources/MenuBarIcon.pdf
        buildPhase: resources
    dependencies:
      - target: MarkItCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Raul Pena."
    entitlements:
      path: MarkIt.entitlements
    settings:
      base:
        PRODUCT_NAME: MarkIt
        PRODUCT_BUNDLE_IDENTIFIER: com.raulpena.markit
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MarkIt.entitlements
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_STYLE: Automatic
        Release:
          # Developer ID for Direct Distribution / notarization (Organizer or scripts/release.sh)
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: D9M7YX54A8
    scheme:
      testTargets:
        - MarkItCoreTests
      gatherCoverageData: false

  MarkItCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MarkItCoreTests
    dependencies:
      - target: MarkItCore
      - target: MarkIt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raulpena.markit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MarkIt.app/Contents/MacOS/MarkIt"
        BUNDLE_LOADER: "$(TEST_HOST)"
